*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--titulo);line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2457D6;outline-offset:2px}
[hidden]{display:none!important}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:40px;padding:0 16px;border-radius:8px;border:1.5px solid var(--tinta);background:var(--tinta);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#0A2229}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--linha)}
.btn.sec:hover{background:#fff;border-color:var(--tinta)}
.btn.perigo{background:transparent;color:var(--alerta);border-color:#E3B8B1}
.btn.perigo:hover{background:var(--alerta-fundo);border-color:var(--alerta)}
.btn.peq{min-height:32px;padding:0 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.campo{display:grid;gap:6px;margin-bottom:14px}
.campo>span{font-weight:600;font-size:.95rem}
.campo small{color:var(--tinta-suave)}
input,select{width:100%;min-height:42px;padding:0 12px;border:1.5px solid var(--linha);border-radius:8px;background:#fff}
input:focus,select:focus{border-color:var(--tinta)}
.erro{background:var(--alerta-fundo);color:var(--alerta);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-weight:500}
.vazio{padding:40px 16px;text-align:center;color:var(--tinta-suave)}
.vazio strong{display:block;color:var(--tinta);font-family:var(--titulo);font-size:1.15rem;margin-bottom:4px}

/* marca */
.marca{font-family:var(--titulo);font-weight:800;font-size:1.3rem;display:inline-flex;align-items:center;gap:10px}
.logo,.marca::before{content:"";display:inline-block;flex:none;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.marca::before{width:1.5em;height:1.5em}

/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-hero{background:var(--tinta);color:#EAF1EC;padding:48px 56px;display:flex;flex-direction:column;justify-content:center;gap:22px;overflow:hidden}
.logo-grande{width:132px;height:132px;color:var(--etiqueta)}
.auth-hero h1{font-size:clamp(2.4rem,4.4vw,3.8rem);font-weight:800;color:#fff}
.auth-hero p{max-width:34ch;font-size:1.15rem;color:#B9CCC4}
.auth-form{padding:48px 24px;display:flex;align-items:center;justify-content:center}
.auth-caixa{width:min(400px,100%)}
.auth-caixa h2{font-size:1.7rem;margin-bottom:18px}
.segmento{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--tinta);border-radius:10px;overflow:hidden;margin-bottom:20px}
.segmento button{background:#fff;border:0;min-height:42px;font-weight:600;cursor:pointer}
.segmento button[aria-pressed="true"]{background:var(--tinta);color:#fff}
.abas{display:flex;gap:20px;border-bottom:1.5px solid var(--linha);margin-bottom:20px}
.abas button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:8px 0;font-weight:600;color:var(--tinta-suave);cursor:pointer}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--etiqueta)}
.demo-info{margin-top:22px;padding:14px;border:1.5px dashed var(--linha);border-radius:10px;font-size:.9rem;color:var(--tinta-suave)}
.demo-info strong{color:var(--tinta)}
.demo-info p+p{margin-top:4px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-hero{padding:28px 24px;gap:12px}.logo-grande{width:60px;height:60px}.auth-hero h1{font-size:2rem}}

/* cliente */
.topo{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding:12px 24px;background:var(--folha);border-bottom:1.5px solid var(--tinta);position:sticky;top:0;z-index:5}
.topo nav{display:flex;gap:4px}
.topo nav button,.lateral nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.topo nav button[aria-current]{background:var(--aviso-fundo)}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.contador{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--etiqueta);color:var(--etiqueta-tinta);font-size:.85rem;font-weight:700}
.pagina{padding:28px 24px 64px;max-width:1180px;margin:0 auto}
.pagina-topo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagina-topo h1{font-size:2rem;font-weight:800}
.busca{width:300px;max-width:100%}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.tag{position:relative;background:var(--folha);border:1.5px solid var(--tinta);border-radius:16px 16px 10px 10px;padding:38px 16px 0;display:flex;flex-direction:column;overflow:hidden}
.tag::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--papel);border:1.5px solid var(--tinta)}
.tag h3{font-size:1.15rem;margin-bottom:6px}
.tag .nota{color:var(--tinta-suave);font-size:.92rem;min-height:1.4em}
.tag .nota.baixo{color:var(--aviso);font-weight:600}
.tag .nota.zero{color:var(--alerta);font-weight:600}
.tag .faixa{margin:14px -16px 0;background:var(--etiqueta);color:var(--etiqueta-tinta);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag.esgotado .faixa{background:#E4E8E4;color:var(--tinta-suave)}
.preco{font-family:var(--titulo);font-weight:800;font-size:1.55rem}
.pedido{background:#fff;border:1.5px solid var(--tinta);border-radius:12px;padding:18px;margin-bottom:16px}
.pedido-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pedido ul{list-style:none;margin:0 0 12px;padding:0}
.pedido li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--linha)}
.pedido-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.total{font-family:var(--titulo);font-weight:800;font-size:1.3rem}

/* gaveta do carrinho e modal */
dialog{color:var(--tinta)}
dialog::backdrop{background:rgba(18,50,59,.45)}
dialog.gaveta{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(420px,100vw);border:0;border-left:1.5px solid var(--tinta);padding:0;background:var(--papel)}
dialog.gaveta[open]{display:flex;flex-direction:column;animation:entra .22s ease-out}
@keyframes entra{from{transform:translateX(28px);opacity:0}}
.g-topo{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1.5px solid var(--tinta);background:#fff}
.g-topo h2{font-size:1.4rem}
#g-corpo{flex:1;overflow:auto;padding:12px 20px;display:flex;flex-direction:column}
.item-carrinho{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--linha)}
.item-carrinho strong{font-weight:600}
.qtd{display:inline-flex;align-items:center;border:1.5px solid var(--linha);border-radius:8px;background:#fff}
.qtd button{width:34px;height:34px;background:none;border:0;font-size:1.1rem;cursor:pointer}
.qtd span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.g-rodape{margin-top:auto;padding-top:16px}
.g-rodape .linha-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.g-rodape .btn{width:100%}
dialog#modal{border:1.5px solid var(--tinta);border-radius:14px;padding:24px;width:min(520px,calc(100vw - 32px));background:#fff}

<body>
<div id="app"></div>
<dialog id="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   MEU COMÉRCIO - front end
   O front end conversa com o sistema só pelo objeto `api` (mais abaixo).
   - Sem servidor C# rodando: usa o MODO DEMONSTRAÇÃO (dados no navegador).
   - Com servidor C# respondendo em /api/ping: usa a API de verdade.

   CONTRATO DA API (JSON; erros: status 4xx com {"erro":"mensagem"})
   POST   /api/login                  {email,senha,tipo}      -> {id,nome,email,tipo}
   GET    /api/produtos                                       -> [{id,nome,preco,estoque}]
   POST   /api/produtos               {nome,preco,estoque}    -> produto
   PUT    /api/produtos/{id}          {nome,preco,estoque}    -> produto
   DELETE /api/produtos/{id}
   POST   /api/produtos/{id}/estoque  {quantidade}            -> produto
   GET    /api/clientes                                       -> [{id,nome,email,pedidos}]
   POST   /api/clientes               {nome,email,senha}      -> {id,nome,email,tipo}
   PUT    /api/clientes/{id}          {nome,email,senha?}     -> cliente
   DELETE /api/clientes/{id}
   GET    /api/pedidos?clienteId=     (clienteId opcional)    -> [pedido]
   POST   /api/pedidos                {clienteId,itens:[{produtoId,quantidade}]} -> pedido
   PUT    /api/pedidos/{id}/status    {status}  ("Concluído" ou "Cancelado")     -> pedido
   DELETE /api/pedidos/{id}           (só pedido Cancelado)
   pedido = {id,clienteId,clienteNome,data,status,total,
             itens:[{produtoId,nome,preco,quantidade}]}
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
/* o C# manda a data com 7 casas de fração (…:11.1234567); alguns navegadores só leem até 3 */
const dataBr = iso => new Date(String(iso).replace(/(\.\d{3})\d+/, '$1')).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const porId = (lista, id) => lista.find(x => String(x.id) === String(id));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sem armazenamento: segue na memória */ } },
  del(k) { try { localStorage.removeItem(k); } catch { } }
};
const ESTOQUE_BAIXO = 5;

/* ---------------------------------------------------------------
   MODO DEMONSTRAÇÃO: imita o que o servidor C# vai fazer
   --------------------------------------------------------------- */
function seed() {
  const agora = Date.now(), h = 3600e3;
  const produtos = [
    { id: 1, nome: 'Café em grão 500g', preco: 24.9, estoque: 18 },
    { id: 2, nome: 'Pão de queijo congelado 1kg', preco: 32, estoque: 3 },
    { id: 3, nome: 'Mel silvestre 300g', preco: 28.5, estoque: 9 },
    { id: 4, nome: 'Geleia de morango 250g', preco: 16.9, estoque: 12 },
    { id: 5, nome: 'Biscoito de polvilho 100g', preco: 7.5, estoque: 40 },
    { id: 6, nome: 'Suco integral de uva 1L', preco: 14, estoque: 0 }
  ];
  const usuarios = [
    { id: 1, tipo: 'gestor', nome: 'Marina Gestora', email: 'gestor@outlook.com', senha: 'gestor123' },
    { id: 2, tipo: 'cliente', nome: 'Carlos Souza', email: 'cliente@gmail.com', senha: 'cliente1' },
    { id: 3, tipo: 'cliente', nome: 'Ana Lima', email: 'ana@hotmail.com', senha: 'ana12345' }
  ];
  const it = (id, q) => { const p = produtos.find(x => x.id === id); return { produtoId: id, nome: p.nome, preco: p.preco, quantidade: q }; };
  const pedidos = [
    { id: 1, clienteId: 2, data: new Date(agora - 30 * h).toISOString(), status: 'Concluído', itens: [it(1, 2), it(3, 1)] },
    { id: 2, clienteId: 3, data: new Date(agora - 5 * h).toISOString(), status: 'Pendente', itens: [it(2, 1), it(5, 3)] },
    { id: 3, clienteId: 2, data: new Date(agora - 52 * h).toISOString(), status: 'Cancelado', itens: [it(4, 2)] }
  ];
  return { produtos, usuarios, pedidos };
}

const Demo = (() => {
  let db = store.get('balcao.db', null) || seed();
  const save = () => store.set('balcao.db', db);
  const fail = m => { throw new Error(m); };
  const nid = l => l.reduce((m, x) => Math.max(m, x.id), 0) + 1;
  const pub = u => ({ id: u.id, nome: u.nome, email: u.email, tipo: u.tipo });
  const pedView = p => ({ ...p, clienteNome: porId(db.usuarios, p.clienteId)?.nome || 'Cliente removido', total: p.itens.reduce((s, i) => s + i.preco * i.quantidade, 0) });
  const clean = s => String(s || '').replace(/\s+/g, ' ').trim();

  const checarProduto = d => {
    if (!clean(d.nome)) fail('Informe o nome do produto.');
    if (!(d.preco >= 0)) fail('Informe um preço válido (zero ou maior).');
    if (!Number.isInteger(d.estoque) || d.estoque < 0) fail('O estoque precisa ser um número inteiro, zero ou maior.');
  };
  const checarUsuario = (d, { id = null, senhaOpcional = false } = {}) => {
    const nome = clean(d.nome), email = String(d.email || '').replace(/\s/g, '').toLowerCase();
    if (!nome) fail('Informe o nome.');
    if (!/^[^\s@]+@(gmail|hotmail|outlook|yahoo)\.com$/.test(email)) fail('Use um e-mail @gmail.com, @hotmail.com, @outlook.com ou @yahoo.com.');
    if (db.usuarios.some(u => u.email === email && u.id !== id)) fail('Já existe uma conta com este e-mail.');
    const temSenha = d.senha && d.senha.length > 0;
    if (!(senhaOpcional && !temSenha) && !(d.senha.length >= 6 && d.senha.length <= 10)) fail('A senha precisa ter de 6 a 10 caracteres.');
    return { nome: nome[0].toUpperCase() + nome.slice(1), email };
  };

  return {
    modo: 'demo',
    resetar() { store.del('balcao.db'); },
    async login({ email, senha, tipo }) {
      const u = db.usuarios.find(x => x.tipo === tipo && x.email === String(email).replace(/\s/g, '').toLowerCase());
      if (!u || u.senha !== senha) fail('E-mail ou senha incorretos.');
      return pub(u);
    },
    async cadastrar(d) { return this.clientes.criar(d); },
    produtos: {
      async listar() { return db.produtos.map(p => ({ ...p })); },
      async criar(d) { checarProduto(d); const p = { id: nid(db.produtos), nome: clean(d.nome), preco: d.preco, estoque: d.estoque }; db.produtos.push(p); save(); return { ...p }; },
      async atualizar(id, d) { const p = porId(db.produtos, id) || fail('Produto não encontrado.'); checarProduto(d); Object.assign(p, { nome: clean(d.nome), preco: d.preco, estoque: d.estoque }); save(); return { ...p }; },
      async excluir(id) {
        const p = porId(db.produtos, id) || fail('Produto não encontrado.');
        if (db.pedidos.some(x => x.itens.some(i => i.produtoId === p.id))) fail('Este produto aparece em pedidos e não pode ser excluído. Zere o estoque para tirá-lo da venda.');
        db.produtos = db.produtos.filter(x => x !== p); save();
      },
      async estocar(id, quantidade) {
        const p = porId(db.produtos, id) || fail('Produto não encontrado.');
        if (!Number.isInteger(quantidade) || quantidade <= 0) fail('A quantidade a adicionar precisa ser maior que zero.');
        p.estoque += quantidade; save(); return { ...p };
      }
    },
    clientes: {
      async listar() { return db.usuarios.filter(u => u.tipo === 'cliente').map(u => ({ ...pub(u), pedidos: db.pedidos.filter(p => p.clienteId === u.id).length })); },
      async criar(d) { const v = checarUsuario(d); const u = { id: nid(db.usuarios), tipo: 'cliente', ...v, senha: d.senha }; db.usuarios.push(u); save(); return pub(u); },
      async atualizar(id, d) {
        const u = porId(db.usuarios.filter(x => x.tipo === 'cliente'), id) || fail('Cliente não encontrado.');
        const v = checarUsuario(d, { id: u.id, senhaOpcional: true }); Object.assign(u, v); if (d.senha) u.senha = d.senha; save(); return pub(u);
      },
      async excluir(id) {
        const u = porId(db.usuarios.filter(x => x.tipo === 'cliente'), id) || fail('Cliente não encontrado.');
        if (db.pedidos.some(p => p.clienteId === u.id)) fail('Este cliente tem pedidos registrados e não pode ser excluído.');
        db.usuarios = db.usuarios.filter(x => x !== u); save();
      }
    },
    pedidos: {
      async listar({ clienteId } = {}) {
        return db.pedidos.filter(p => clienteId == null || String(p.clienteId) === String(clienteId)).map(pedView).sort((a, b) => b.id - a.id);
      },
      async criar({ clienteId, itens }) {
        if (!itens || !itens.length) fail('O carrinho está vazio.');
        const linhas = itens.map(i => {
          const p = porId(db.produtos, i.produtoId) || fail('Um produto do carrinho não existe mais.');
          if (!(i.quantidade >= 1)) fail('Quantidade inválida.');
          if (p.estoque < i.quantidade) fail(`Estoque insuficiente de ${p.nome}: restam ${p.estoque}.`);
          return { p, q: i.quantidade };
        });
        linhas.forEach(({ p, q }) => { p.estoque -= q; });
        const ped = { id: nid(db.pedidos), clienteId, data: new Date().toISOString(), status: 'Pendente', itens: linhas.map(({ p, q }) => ({ produtoId: p.id, nome: p.nome, preco: p.preco, quantidade: q })) };
        db.pedidos.push(ped); save(); return pedView(ped);
      },
      async status(id, status) {
        const p = porId(db.pedidos, id) || fail('Pedido não encontrado.');
        if (p.status !== 'Pendente') fail(`Pedido ${p.status.toLowerCase()} não pode mudar de status.`);
        if (!['Concluído', 'Cancelado'].includes(status)) fail('Status inválido.');
        if (status === 'Cancelado') p.itens.forEach(i => { const pr = porId(db.produtos, i.produtoId); if (pr) pr.estoque += i.quantidade; });
        p.status = status; save(); return pedView(p);
      },
      async excluir(id) {
        const p = porId(db.pedidos, id) || fail('Pedido não encontrado.');
        if (p.status !== 'Cancelado') fail('Só dá para excluir pedidos cancelados.');
        db.pedidos = db.pedidos.filter(x => x !== p); save();
      }
    }
  };
})();

/* ---------------------------------------------------------------
   API DE VERDADE: fala com o servidor C#
   --------------------------------------------------------------- */
const Remote = (() => {
  const call = async (metodo, url, corpo) => {
    const r = await fetch('/api' + url, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
    const txt = await r.text(); let dados = null;
    try { dados = txt ? JSON.parse(txt) : null; } catch { /* resposta sem JSON */ }
    if (!r.ok) throw new Error(dados?.erro || `Erro ${r.status} ao falar com o servidor.`);
    return dados;
  };
  return {
    modo: 'api',
    login: d => call('POST', '/login', d),
    cadastrar: d => call('POST', '/clientes', d),
    produtos: {
      listar: () => call('GET', '/produtos'),
      criar: d => call('POST', '/produtos', d),
      atualizar: (id, d) => call('PUT', `/produtos/${id}`, d),
      excluir: id => call('DELETE', `/produtos/${id}`),
      estocar: (id, quantidade) => call('POST', `/produtos/${id}/estoque`, { quantidade })
    },
    clientes: {
      listar: () => call('GET', '/clientes'),
      criar: d => call('POST', '/clientes', d),
      atualizar: (id, d) => call('PUT', `/clientes/${id}`, d),
      excluir: id => call('DELETE', `/clientes/${id}`)
    },
    pedidos: {
      listar: ({ clienteId } = {}) => call('GET', '/pedidos' + (clienteId != null ? `?clienteId=${clienteId}` : '')),
      criar: d => call('POST', '/pedidos', d),
      status: (id, status) => call('PUT', `/pedidos/${id}/status`, { status }),
      excluir: id => call('DELETE', `/pedidos/${id}`)
    }
  };
})();

async function servidorDisponivel() {
  if (location.protocol === 'file:') return false;
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 1200);
    const r = await fetch('/api/ping', { signal: c.signal }); clearTimeout(t); return r.ok;
  } catch { return false; }
}

/* ---------------------------------------------------------------
   ESTADO E UTILITÁRIOS DE TELA
   --------------------------------------------------------------- */
let api = Demo;
const kSessao = () => 'balcao.sessao.' + api.modo;
const kCarrinho = id => 'balcao.carrinho.' + api.modo + '.' + id;
const state = { user: null, view: 'loja', produtos: [], pedidos: [], clientes: [], carrinho: [], busca: '', auth: { tipo: 'cliente', aba: 'entrar' } };

let tToast;
function toast(msg, tipo = 'ok') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (tipo === 'erro' ? 'erro' : '');
  clearTimeout(tToast); tToast = setTimeout(() => { t.className = 'toast'; }, 4000);
}
async function tentar(fn) { try { return await fn(); } catch (e) { toast(e.message || 'Algo deu errado.', 'erro'); } }

async function carregar() {
  const u = state.user;
  if (u.tipo === 'cliente') {
    [state.produtos, state.pedidos] = await Promise.all([api.produtos.listar(), api.pedidos.listar({ clienteId: u.id })]);
  } else {
    [state.produtos, state.pedidos, state.clientes] = await Promise.all([api.produtos.listar(), api.pedidos.listar(), api.clientes.listar()]);
  }
}
async function recarregar() { await carregar(); renderConteudo(); atualizarCarrinho(); }

function chipStatus(s) { return `<span class="chip ${s === 'Concluído' ? 'ok' : s === 'Cancelado' ? 'alerta' : 'aviso'}">${esc(s)}</span>`; }
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isNaN(n) ? NaN : n; };

/* ---------------------------------------------------------------
   MODAIS (formulário e confirmação)
   --------------------------------------------------------------- */
function formModal({ titulo, campos, valores = {}, botao = 'Salvar', enviar }) {
  const m = $('#modal');
  m.innerHTML = `<form class="m-form" novalidate>
    <h2>${esc(titulo)}</h2>
    ${campos.map(c => `<label class="campo"><span>${esc(c.label)}</span>
      <input name="${c.name}" type="${c.type || 'text'}" value="${esc(valores[c.name] ?? '')}" ${c.attrs || ''} autocomplete="off">
      ${c.ajuda ? `<small>${esc(c.ajuda)}</small>` : ''}</label>`).join('')}
    <p class="erro" role="alert" hidden></p>
    <div class="m-acoes"><button type="button" class="btn sec" data-fechar>Cancelar</button><button class="btn" type="submit">${esc(botao)}</button></div>
  </form>`;
  const f = m.querySelector('form');
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const bt = f.querySelector('[type=submit]'); bt.disabled = true;
    try { await enviar(Object.fromEntries(new FormData(f))); m.close(); }
    catch (e) { const p = f.querySelector('.erro'); p.textContent = e.message; p.hidden = false; bt.disabled = false; }
  });
  m.showModal(); f.querySelector('input')?.focus();
}
function confirmar({ titulo, texto, botao, perigo = true, fazer }) {
  const m = $('#modal');
  m.innerHTML = `<form class="m-form"><h2>${esc(titulo)}</h2><p class="texto">${esc(texto)}</p>
    <div class="m-acoes"><button type="button" class="btn sec" data-fechar>Voltar</button><button class="btn ${perigo ? 'perigo' : ''}" type="submit">${esc(botao)}</button></div></form>`;
  m.querySelector('form').addEventListener('submit', async ev => { ev.preventDefault(); m.close(); await tentar(fazer); });
  m.showModal(); m.querySelector('[type=submit]').focus();
}

/* ---------------------------------------------------------------
   LOGIN
   --------------------------------------------------------------- */
function renderAuth() {
  state.user = null;
  $('#app').innerHTML = `<main class="auth">
    <section class="auth-hero">
      <div class="logo logo-grande" role="img" aria-label="Logo de uma loja"></div>
      <h1>Meu Comércio</h1>
      <p>Sistema de gestão para pequenas lojas.</p>
    </section>
    <section class="auth-form"><div class="auth-caixa">
      <h2>Acesse sua conta</h2>
      <div class="segmento" role="group" aria-label="Tipo de acesso">
        <button type="button" data-action="auth-tipo" data-tipo="cliente" aria-pressed="${state.auth.tipo === 'cliente'}">Sou cliente</button>
        <button type="button" data-action="auth-tipo" data-tipo="gestor" aria-pressed="${state.auth.tipo === 'gestor'}">Sou gestor</button>
      </div>
      <div id="auth-corpo"></div>
      ${api.modo === 'demo' ? `<div class="demo-info"><p><strong>Modo demonstração.</strong> Os dados ficam só neste navegador.</p>
        <p>Gestor: gestor@outlook.com / gestor123</p><p>Cliente: cliente@gmail.com / cliente1</p></div>` : ''}
    </div></section></main>`;
  renderAuthCorpo();
}
function renderAuthCorpo() {
  const { tipo, aba } = state.auth, cad = tipo === 'cliente' && aba === 'cadastro';
  $('#auth-corpo').innerHTML = `
    ${tipo === 'cliente' ? `<div class="abas" role="tablist">
      <button role="tab" type="button" data-action="auth-aba" data-aba="entrar" aria-selected="${aba === 'entrar'}">Entrar</button>
      <button role="tab" type="button" data-action="auth-aba" data-aba="cadastro" aria-selected="${aba === 'cadastro'}">Criar conta</button></div>` : ''}
    <form id="form-auth" novalidate>
      ${cad ? `<label class="campo"><span>Nome</span><input name="nome" autocomplete="name"></label>` : ''}
      <label class="campo"><span>E-mail</span><input name="email" type="email" autocomplete="email"></label>
      <label class="campo"><span>Senha</span><input name="senha" type="password" autocomplete="${cad ? 'new-password' : 'current-password'}">
        ${cad ? '<small>De 6 a 10 caracteres.</small>' : ''}</label>
      <p class="erro" role="alert" hidden></p>
      <button class="btn" style="width:100%" type="submit">${cad ? 'Criar conta' : 'Entrar'}</button>
    </form>`;
}
async function enviarAuth(form) {
  const v = Object.fromEntries(new FormData(form)), erro = form.querySelector('.erro');
  erro.hidden = true;
  try {
    const cad = state.auth.tipo === 'cliente' && state.auth.aba === 'cadastro';
    const u = cad ? await api.cadastrar({ nome: v.nome, email: v.email, senha: v.senha }) : await api.login({ email: v.email, senha: v.senha, tipo: state.auth.tipo });
    iniciarSessao({ id: u.id, nome: u.nome, email: u.email, tipo: u.tipo || state.auth.tipo });
  } catch (e) { erro.textContent = e.message; erro.hidden = false; }
}
async function iniciarSessao(u) {
  state.user = u; store.set(kSessao(), u);
  state.carrinho = u.tipo === 'cliente' ? store.get(kCarrinho(u.id), []) : [];
  state.view = u.tipo === 'gestor' ? 'painel' : 'loja'; state.busca = '';
  try { await carregar(); renderShell(); } catch (e) { renderAuth(); toast(e.message, 'erro'); }
}
function sair() { store.del(kSessao()); state.user = null; renderAuth(); }

/* ---------------------------------------------------------------
   CASCAS (cliente e gestor)
   --------------------------------------------------------------- */
function renderShell() {
  const u = state.user;
  if (u.tipo === 'cliente') {
    $('#app').innerHTML = `<header class="topo">
        <div class="marca">Meu Comércio</div>
        <nav aria-label="Principal"><button data-action="ver" data-view="loja">Loja</button><button data-action="ver" data-view="pedidos">Meus pedidos</button></nav>
        <div class="topo-dir">
          <button class="btn sec" data-action="abrir-carrinho">Carrinho <span class="contador" id="contador">0</span></button>
          <span>Olá, ${esc(u.nome.split(' ')[0])}</span>
          <button class="btn sec peq" data-action="sair">Sair</button>
        </div></header>
      <main id="conteudo" class="pagina"></main>
      <dialog id="gaveta" class="gaveta" aria-label="Carrinho"><div class="g-topo"><h2>Carrinho</h2><button class="btn sec peq" data-fechar>Fechar</button></div><div id="g-corpo"></div></dialog>`;
  } else {
    $('#app').innerHTML = `<div class="gestor"><aside class="lateral">
        <div class="marca">Meu Comércio</div>
        <nav aria-label="Principal">
          <button data-action="ver" data-view="painel">Painel geral</button><button data-action="ver" data-view="produtos">Produtos</button>
          <button data-action="ver" data-view="pedidos">Pedidos</button><button data-action="ver" data-view="clientes">Clientes</button></nav>
        <div class="rodape">
          ${api.modo === 'demo' ? `<div class="modo-demo">Modo demonstração: dados salvos só neste navegador.</div>` : ''}
          <div class="quem"><strong>${esc(u.nome)}</strong>Gestor</div>
          ${api.modo === 'demo' ? `<button class="btn peq" data-action="resetar-demo">Restaurar dados de exemplo</button>` : ''}
          <button class="btn peq" data-action="sair">Sair</button>
        </div></aside><main id="conteudo" class="pagina"></main></div>`;
  }
  renderConteudo(); atualizarCarrinho();
}

function renderConteudo() {
  const c = $('#conteudo'); if (!c || !state.user) return;
  const v = VIEWS[state.user.tipo][state.view]; c.innerHTML = v();
  document.querySelectorAll('[data-view]').forEach(b => { if (b.dataset.view === state.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function atualizarLista() { const l = $('#lista'); if (l) l.innerHTML = LISTAS[state.user.tipo + ':' + state.view](); }

/* ---------------------------------------------------------------
   TELAS DO CLIENTE
   --------------------------------------------------------------- */
function htmlLoja() {
  const q = state.busca.trim().toLowerCase();
  const lista = state.produtos.filter(p => p.nome.toLowerCase().includes(q));
  if (!state.produtos.length) return `<div class="vazio"><strong>A loja ainda não tem produtos.</strong>Volte em breve.</div>`;
  if (!lista.length) return `<div class="vazio"><strong>Nada encontrado para "${esc(state.busca)}".</strong>Tente outro nome.</div>`;
  return `<div class="grade">${lista.map(p => {
    const esg = p.estoque <= 0;
    const nota = esg ? `<p class="nota zero">Esgotado</p>` : p.estoque <= ESTOQUE_BAIXO ? `<p class="nota baixo">Restam ${p.estoque}</p>` : `<p class="nota">${p.estoque} disponíveis</p>`;
    return `<article class="tag ${esg ? 'esgotado' : ''}"><h3>${esc(p.nome)}</h3>${nota}
      <div class="faixa"><span class="preco">${brl(p.preco)}</span><button class="btn peq" data-action="add" data-id="${p.id}" ${esg ? 'disabled' : ''}>Adicionar</button></div></article>`;
  }).join('')}</div>`;
}
function htmlPedidosCliente() {
  if (!state.pedidos.length) return `<div class="vazio"><strong>Você ainda não fez pedidos.</strong>Escolha produtos na loja e finalize o carrinho.</div>`;
  return state.pedidos.map(p => `<article class="pedido">
    <div class="pedido-topo"><h3>Pedido ${p.id}</h3><span>${dataBr(p.data)} ${chipStatus(p.status)}</span></div>
    <ul>${p.itens.map(i => `<li><span>${i.quantidade} × ${esc(i.nome)}</span><span>${brl(i.preco * i.quantidade)}</span></li>`).join('')}</ul>
    <div class="pedido-rodape"><span class="total">${brl(p.total)}</span>
      ${p.status === 'Pendente' ? `<button class="btn perigo peq" data-action="cliente-cancelar" data-id="${p.id}">Cancelar pedido</button>` : ''}</div></article>`).join('');
}

/* carrinho */
const itensCarrinho = () => state.carrinho.map(i => { const p = porId(state.produtos, i.produtoId); return p ? { ...i, produto: p } : null; }).filter(Boolean);
const totalCarrinho = () => itensCarrinho().reduce((s, i) => s + i.produto.preco * i.quantidade, 0);
function salvarCarrinho() { store.set(kCarrinho(state.user.id), state.carrinho); atualizarCarrinho(); }
function atualizarCarrinho() {
  if (state.user?.tipo !== 'cliente') return;
  const itens = itensCarrinho();
  const cont = $('#contador'); if (cont) cont.textContent = itens.reduce((s, i) => s + i.quantidade, 0);
  const corpo = $('#g-corpo'); if (!corpo) return;
  corpo.innerHTML = !itens.length
    ? `<div class="vazio"><strong>Seu carrinho está vazio.</strong>Escolha produtos na loja.</div>`
    : `${itens.map(i => `<div class="item-carrinho"><strong>${esc(i.produto.nome)}</strong><span>${brl(i.produto.preco * i.quantidade)}</span>
        <div class="qtd"><button aria-label="Diminuir" data-action="qtd" data-id="${i.produto.id}" data-delta="-1">−</button><span>${i.quantidade}</span><button aria-label="Aumentar" data-action="qtd" data-id="${i.produto.id}" data-delta="1">+</button></div>
        <button class="btn sec peq" data-action="remover" data-id="${i.produto.id}">Remover</button></div>`).join('')}
      <div class="g-rodape"><div class="linha-total"><span>Total</span><span class="total">${brl(totalCarrinho())}</span></div>
      <button class="btn" data-action="finalizar">Finalizar pedido</button></div>`;
}

/* ---------------------------------------------------------------
   TELAS DO GESTOR
   --------------------------------------------------------------- */
function htmlPainel() {
  const vendido = state.pedidos.filter(p => p.status === 'Concluído').reduce((t, p) => t + p.total, 0);
  const pend = state.pedidos.filter(p => p.status === 'Pendente').length;
  const repor = state.produtos.filter(p => p.estoque <= ESTOQUE_BAIXO).length;
  const atalho = (view, titulo, texto, info) => `<article class="atalho"><h3>${titulo}</h3><p>${texto}</p><p class="info">${info}</p>
      <button class="btn sec peq" data-action="ver" data-view="${view}">Abrir ${titulo.toLowerCase()}</button></article>`;
  return `<div class="pagina-topo"><h1>Painel geral</h1></div>
  <div class="resumo">
    <div><span class="valor">${brl(vendido)}</span><span class="rotulo">em pedidos concluídos</span></div>
    <div><span class="valor">${pend}</span><span class="rotulo">pedidos para atender</span></div>
    <div><span class="valor">${repor}</span><span class="rotulo">produtos para repor</span></div>
  </div>
  <div class="atalhos">
    ${atalho('produtos', 'Produtos', 'Cadastre, edite, reponha o estoque e exclua produtos.', `${state.produtos.length} cadastrados`)}
    ${atalho('pedidos', 'Pedidos', 'Crie pedidos, conclua, cancele e exclua os cancelados.', `${pend} esperando atendimento`)}
    ${atalho('clientes', 'Clientes', 'Gerencie as contas de quem compra na loja.', `${state.clientes.length} cadastrados`)}
  </div>
  <section class="bloco"><div class="pagina-topo"><h2>Produtos</h2><button class="btn" data-action="prod-novo">Novo produto</button></div>${tabelaProdutos()}</section>
  <section class="bloco"><div class="pagina-topo"><h2>Pedidos</h2><button class="btn" data-action="ped-novo">Novo pedido</button></div>${tabelaPedidos()}</section>`;
}
const chipEstoque = p => p.estoque <= 0 ? `<span class="chip alerta">Esgotado</span>` : p.estoque <= ESTOQUE_BAIXO ? `<span class="chip aviso">${p.estoque} restantes</span>` : `<span class="num">${p.estoque}</span>`;

function htmlProdutos() {
  return `<div class="pagina-topo"><h1>Produtos</h1><div style="display:flex;gap:10px;flex-wrap:wrap">
    <input id="busca" class="busca" type="search" placeholder="Buscar produto" aria-label="Buscar produto" value="${esc(state.busca)}">
    <button class="btn" data-action="prod-novo">Novo produto</button></div></div><div id="lista">${tabelaProdutos()}</div>`;
}
function tabelaProdutos() {
  const q = state.busca.trim().toLowerCase(), l = state.produtos.filter(p => p.nome.toLowerCase().includes(q));
  if (!state.produtos.length) return `<div class="vazio"><strong>Nenhum produto cadastrado.</strong>Use "Novo produto" para começar.</div>`;
  if (!l.length) return `<div class="vazio"><strong>Nada encontrado para "${esc(state.busca)}".</strong></div>`;
  return `<div class="tabela-wrap"><table><thead><tr><th>Produto</th><th class="num">Preço</th><th>Estoque</th><th></th></tr></thead><tbody>${l.map(p => `<tr>
    <td><strong>${esc(p.nome)}</strong></td><td class="num">${brl(p.preco)}</td><td>${chipEstoque(p)}</td>
    <td><div class="acoes"><button class="btn sec peq" data-action="prod-estocar" data-id="${p.id}">Estocar</button>
    <button class="btn sec peq" data-action="prod-editar" data-id="${p.id}">Editar</button>
    <button class="btn perigo peq" data-action="prod-excluir" data-id="${p.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`;
}

function tabelaPedidos() {
  if (!state.pedidos.length) return `<div class="vazio"><strong>Nenhum pedido ainda.</strong>Use "Novo pedido" ou aguarde os pedidos dos clientes.</div>`;
  return `<div class="tabela-wrap"><table>
    <thead><tr><th>Pedido</th><th>Cliente</th><th>Itens</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>${state.pedidos.map(p => `<tr>
    <td><strong>${p.id}</strong><br><span class="itens-resumo">${dataBr(p.data)}</span></td><td>${esc(p.clienteNome)}</td>
    <td class="itens-resumo">${p.itens.map(i => `${i.quantidade} × ${esc(i.nome)}`).join(', ')}</td>
    <td class="num">${brl(p.total)}</td><td>${chipStatus(p.status)}</td>
    <td><div class="acoes">${p.status === 'Pendente'
      ? `<button class="btn peq" data-action="ped-status" data-id="${p.id}" data-status="Concluído">Concluir</button><button class="btn perigo peq" data-action="ped-status" data-id="${p.id}" data-status="Cancelado">Cancelar</button>`
      : p.status === 'Cancelado' ? `<button class="btn perigo peq" data-action="ped-excluir" data-id="${p.id}">Excluir</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>`;
}
function htmlPedidosGestor() {
  return `<div class="pagina-topo"><h1>Pedidos</h1><button class="btn" data-action="ped-novo">Novo pedido</button></div>${tabelaPedidos()}`;
}

function htmlClientes() {
  return `<div class="pagina-topo"><h1>Clientes</h1><button class="btn" data-action="cli-novo">Novo cliente</button></div>
  ${!state.clientes.length ? `<div class="vazio"><strong>Nenhum cliente cadastrado.</strong>Clientes também podem criar a própria conta na tela de entrada.</div>`
    : `<div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th class="num">Pedidos</th><th></th></tr></thead><tbody>${state.clientes.map(c => `<tr>
    <td><strong>${esc(c.nome)}</strong></td><td>${esc(c.email)}</td><td class="num">${c.pedidos}</td>
    <td><div class="acoes"><button class="btn sec peq" data-action="cli-editar" data-id="${c.id}">Editar</button>
    <button class="btn perigo peq" data-action="cli-excluir" data-id="${c.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`}`;
}

const VIEWS = {
  cliente: {
    loja: () => `<div class="pagina-topo"><h1>Loja</h1><input id="busca" class="busca" type="search" placeholder="Buscar produto" aria-label="Buscar produto" value="${esc(state.busca)}"></div><div id="lista">${htmlLoja()}</div>`,
    pedidos: () => `<div class="pagina-topo"><h1>Meus pedidos</h1></div>${htmlPedidosCliente()}`
  },
  gestor: { painel: htmlPainel, produtos: htmlProdutos, pedidos: htmlPedidosGestor, clientes: htmlClientes }
};
const LISTAS = { 'cliente:loja': htmlLoja, 'gestor:produtos': tabelaProdutos };

/* ---------------------------------------------------------------
   AÇÕES (cliques)
   --------------------------------------------------------------- */
/* o gestor registra um pedido em nome de um cliente (venda no balcão) */
function novoPedido() {
  const vendaveis = state.produtos.filter(p => p.estoque > 0);
  if (!state.clientes.length) return toast('Cadastre um cliente antes de criar um pedido.', 'erro');
  if (!vendaveis.length) return toast('Nenhum produto com estoque para vender.', 'erro');
  const m = $('#modal');
  const opcoes = vendaveis.map(p => `<option value="${esc(p.id)}">${esc(p.nome)} - ${brl(p.preco)} (${p.estoque} em estoque)</option>`).join('');
  const linha = () => `<div class="linha-item"><select aria-label="Produto">${opcoes}</select><input type="number" min="1" step="1" value="1" aria-label="Quantidade"><button type="button" class="btn sec peq" data-rem>Remover</button></div>`;
  m.innerHTML = `<form class="m-form" novalidate><h2>Novo pedido</h2>
    <label class="campo"><span>Cliente</span><select name="cliente">${state.clientes.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('')}</select></label>
    <div class="campo"><span>Itens</span><div id="linhas">${linha()}</div><button type="button" class="btn sec peq" data-add style="justify-self:start">Adicionar item</button></div>
    <p class="erro" role="alert" hidden></p>
    <div class="m-acoes"><button type="button" class="btn sec" data-fechar>Cancelar</button><button class="btn" type="submit">Criar pedido</button></div></form>`;
  const f = m.querySelector('form'), linhas = f.querySelector('#linhas');
  f.addEventListener('click', e => {
    if (e.target.closest('[data-add]')) linhas.insertAdjacentHTML('beforeend', linha());
    const rem = e.target.closest('[data-rem]');
    if (rem && linhas.children.length > 1) rem.closest('.linha-item').remove();
  });
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const bt = f.querySelector('[type=submit]'), erro = f.querySelector('.erro'); bt.disabled = true; erro.hidden = true;
    try {
      const cliente = porId(state.clientes, f.elements.cliente.value), somados = new Map();
      linhas.querySelectorAll('.linha-item').forEach(l => {
        const p = porId(vendaveis, l.querySelector('select').value), q = Number(l.querySelector('input').value);
        somados.set(p.id, (somados.get(p.id) || 0) + q);
      });
      const ped = await api.pedidos.criar({ clienteId: cliente.id, itens: [...somados].map(([produtoId, quantidade]) => ({ produtoId, quantidade })) });
      m.close(); await recarregar(); toast(`Pedido ${ped.id} criado.`);
    } catch (e) { erro.textContent = e.message; erro.hidden = false; bt.disabled = false; }
  });
  m.showModal(); f.elements.cliente.focus();
}

const camposProduto = [
  { name: 'nome', label: 'Nome do produto', attrs: 'required maxlength="80"' },
  { name: 'preco', label: 'Preço (R$)', type: 'number', attrs: 'min="0" step="0.01" required' },
  { name: 'estoque', label: 'Estoque (unidades)', type: 'number', attrs: 'min="0" step="1" required' }
];
const lerProduto = v => ({ nome: v.nome, preco: num(v.preco), estoque: v.estoque === '' ? NaN : Number(v.estoque) });

const acoes = {
  'auth-tipo': d => { state.auth.tipo = d.tipo; if (d.tipo === 'gestor') state.auth.aba = 'entrar'; renderAuth(); },
  'auth-aba': d => { state.auth.aba = d.aba; renderAuthCorpo(); },
  sair,
  'resetar-demo': () => confirmar({ titulo: 'Restaurar dados de exemplo?', texto: 'Produtos, clientes e pedidos criados por você neste navegador serão apagados.', botao: 'Restaurar', fazer: () => { Demo.resetar(); store.del(kSessao()); location.reload(); } }),
  ver: d => { state.view = d.view; state.busca = ''; renderConteudo(); },
  'abrir-carrinho': () => { atualizarCarrinho(); $('#gaveta').showModal(); },

  /* cliente */
  add: d => {
    const p = porId(state.produtos, d.id); if (!p) return;
    const item = state.carrinho.find(i => String(i.produtoId) === String(p.id)), atual = item ? item.quantidade : 0;
    if (atual + 1 > p.estoque) return toast(`Só há ${p.estoque} de ${p.nome} em estoque.`, 'erro');
    if (item) item.quantidade++; else state.carrinho.push({ produtoId: p.id, quantidade: 1 });
    salvarCarrinho(); toast(`${p.nome} no carrinho.`);
  },
  qtd: d => {
    const item = state.carrinho.find(i => String(i.produtoId) === String(d.id)), p = porId(state.produtos, d.id); if (!item || !p) return;
    const nova = item.quantidade + Number(d.delta);
    if (nova > p.estoque) return toast(`Só há ${p.estoque} de ${p.nome} em estoque.`, 'erro');
    if (nova < 1) state.carrinho = state.carrinho.filter(i => i !== item); else item.quantidade = nova;
    salvarCarrinho();
  },
  remover: d => { state.carrinho = state.carrinho.filter(i => String(i.produtoId) !== String(d.id)); salvarCarrinho(); },
  finalizar: () => tentar(async () => {
    const ped = await api.pedidos.criar({ clienteId: state.user.id, itens: state.carrinho.map(i => ({ produtoId: i.produtoId, quantidade: i.quantidade })) });
    state.carrinho = []; salvarCarrinho(); $('#gaveta').close(); state.view = 'pedidos';
    await recarregar(); toast(`Pedido ${ped.id} enviado.`);
  }),
  'cliente-cancelar': d => confirmar({ titulo: `Cancelar o pedido ${d.id}?`, texto: 'Os produtos voltam para o estoque.', botao: 'Cancelar pedido', fazer: async () => { await api.pedidos.status(d.id, 'Cancelado'); await recarregar(); toast('Pedido cancelado.'); } }),

  /* gestor: produtos */
  'prod-novo': () => formModal({ titulo: 'Novo produto', campos: camposProduto, enviar: async v => { await api.produtos.criar(lerProduto(v)); await recarregar(); toast('Produto criado.'); } }),
  'prod-editar': d => { const p = porId(state.produtos, d.id); formModal({ titulo: 'Editar produto', campos: camposProduto, valores: p, enviar: async v => { await api.produtos.atualizar(p.id, lerProduto(v)); await recarregar(); toast('Produto atualizado.'); } }); },
  'prod-estocar': d => { const p = porId(state.produtos, d.id); formModal({ titulo: `Adicionar estoque: ${p.nome}`, botao: 'Adicionar', campos: [{ name: 'quantidade', label: 'Quantidade a adicionar', type: 'number', attrs: 'min="1" step="1" required', ajuda: `Estoque atual: ${p.estoque}` }], enviar: async v => { await api.produtos.estocar(p.id, v.quantidade === '' ? NaN : Number(v.quantidade)); await recarregar(); toast('Estoque atualizado.'); } }); },
  'prod-excluir': d => { const p = porId(state.produtos, d.id); confirmar({ titulo: `Excluir ${p.nome}?`, texto: 'O produto sai da loja. Essa ação não pode ser desfeita.', botao: 'Excluir produto', fazer: async () => { await api.produtos.excluir(p.id); await recarregar(); toast('Produto excluído.'); } }); },

  /* gestor: pedidos */
  'ped-novo': () => novoPedido(),
  'ped-status': d => {
    const cancelar = d.status === 'Cancelado';
    confirmar({ titulo: `${cancelar ? 'Cancelar' : 'Concluir'} o pedido ${d.id}?`, texto: cancelar ? 'Os produtos voltam para o estoque.' : 'O pedido será marcado como concluído e não poderá mais ser alterado.', botao: cancelar ? 'Cancelar pedido' : 'Concluir pedido', perigo: cancelar,
      fazer: async () => { await api.pedidos.status(d.id, d.status); await recarregar(); toast(cancelar ? 'Pedido cancelado.' : 'Pedido concluído.'); } });
  },
  'ped-excluir': d => confirmar({ titulo: `Excluir o pedido ${d.id}?`, texto: 'O registro do pedido cancelado será apagado.', botao: 'Excluir pedido', fazer: async () => { await api.pedidos.excluir(d.id); await recarregar(); toast('Pedido excluído.'); } }),

  /* gestor: clientes */
  'cli-novo': () => formModal({ titulo: 'Novo cliente', campos: [
    { name: 'nome', label: 'Nome', attrs: 'required' }, { name: 'email', label: 'E-mail', type: 'email', attrs: 'required' },
    { name: 'senha', label: 'Senha', type: 'password', ajuda: 'De 6 a 10 caracteres.', attrs: 'required' }], enviar: async v => { await api.clientes.criar(v); await recarregar(); toast('Cliente criado.'); } }),
  'cli-editar': d => { const c = porId(state.clientes, d.id); formModal({ titulo: 'Editar cliente', valores: c, campos: [
    { name: 'nome', label: 'Nome', attrs: 'required' }, { name: 'email', label: 'E-mail', type: 'email', attrs: 'required' },
    { name: 'senha', label: 'Nova senha', type: 'password', ajuda: 'Deixe em branco para manter a senha atual.' }], enviar: async v => { await api.clientes.atualizar(c.id, v); await recarregar(); toast('Cliente atualizado.'); } }); },
  'cli-excluir': d => { const c = porId(state.clientes, d.id); confirmar({ titulo: `Excluir ${c.nome}?`, texto: 'A conta do cliente será apagada. Essa ação não pode ser desfeita.', botao: 'Excluir cliente', fazer: async () => { await api.clientes.excluir(c.id); await recarregar(); toast('Cliente excluído.'); } }); }
};

document.addEventListener('click', e => {
  const fechar = e.target.closest('[data-fechar]'); if (fechar) return fechar.closest('dialog').close();
  if (e.target.tagName === 'DIALOG') return e.target.close();
  const b = e.target.closest('[data-action]'); if (!b) return;
  const fn = acoes[b.dataset.action]; if (fn) tentar(() => fn(b.dataset, b));
});
document.addEventListener('submit', e => { if (e.target.id === 'form-auth') { e.preventDefault(); enviarAuth(e.target); } });
document.addEventListener('input', e => { if (e.target.id === 'busca') { state.busca = e.target.value; atualizarLista(); } });

/* ---------------------------------------------------------------
   INÍCIO
   --------------------------------------------------------------- */
(async () => {
  api = (await servidorDisponivel()) ? Remote : Demo;
  const s = store.get(kSessao(), null);
  if (s) await iniciarSessao(s); else renderAuth();
})();
</script>
</body>
</html>
